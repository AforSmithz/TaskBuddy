# Synthesises the CDK app and posts the diff on any pull request that touches
# something deployable. It never deploys: the point is that a reviewer sees the
# blast radius before merging, not that CI holds credentials able to change
# production.
#
# This replaces the Azure `infra what-if` workflow. The app moved off
# Azure + Vercel to AWS in August 2026; azure/ is still in the tree as history.
#
# Auth is OIDC federation, no stored key. The role is created by
# aws/infra/lib/cicd-stack.ts and trusts exactly one subject:
#
#   repo:AforSmithz/TaskBuddy:pull_request
#
# It can read, and it can assume the CDK bootstrap LOOKUP role. It deliberately
# cannot assume the deploy role, because a pull_request workflow runs the
# workflow file as written in the pull request - so this job's own YAML is not
# trusted input, and no amount of editing it can widen what the role may do.
#
# `--no-change-set` for the same reason: a change-set diff is more precise, and
# it is a write. Template comparison keeps the job read-only.
name: infra diff

on:
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/**'
      - 'aws/**'
      - 'proxy.ts'
      - 'next.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/infra-diff.yml'

permissions:
  id-token: write # required to mint the OIDC token
  contents: read
  pull-requests: write # required to post the diff as a comment

env:
  AWS_REGION: ap-southeast-1
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A fork gets no OIDC token and no secrets, so the job would fail at the
    # credentials step with something that reads like a broken pipeline.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install CDK dependencies
        run: npm ci
        working-directory: aws/infra

      - name: Typecheck (app)
        run: pnpm exec tsc --noEmit

      - name: Typecheck (infra)
        run: npm run typecheck
        working-directory: aws/infra

      - name: Lint
        run: pnpm lint

      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'proxy.ts', 'next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DIFF_ROLE_ARN }}
          aws-region: ap-southeast-1

      # Synth needs the artefacts, not just the source: the web stack packages
      # aws/.build/web as a Lambda asset and aws/.build/static as an S3
      # deployment, and CDK cannot synthesise either from a directory that does
      # not exist. The build doubles as the PR's build check.
      - name: Build
        run: bash aws/scripts/build-web.sh

      - name: Diff
        id: diff
        env:
          # Both are synth inputs, so a diff cannot run without them either. The
          # alert email lands in an SNS subscription and the origin secret in the
          # web template, so a placeholder here would render as a spurious diff
          # against production rather than as a missing value.
          TASKBUDDY_ALERT_EMAIL: ${{ secrets.TASKBUDDY_ALERT_EMAIL }}
          TASKBUDDY_ORIGIN_SECRET: ${{ secrets.TASKBUDDY_ORIGIN_SECRET }}
        run: |
          cd aws/infra
          npx cdk diff --all --no-change-set > "$GITHUB_WORKSPACE/diff.txt" 2>&1 || true
          cat "$GITHUB_WORKSPACE/diff.txt"

      - name: Comment diff on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const plan = fs.readFileSync('diff.txt', 'utf8')
            // 65536 is the GitHub comment ceiling; leave room for the wrapper.
            const clipped = plan.length > 60000
              ? plan.slice(0, 60000) + '\n\n...truncated, see the job log.'
              : plan
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                '### CDK diff',
                '',
                'The web function and the S3 asset ALWAYS show as changed: Next',
                'content-hashes every chunk per build, so the asset hash differs',
                'even for an identical commit. Read past those two.',
                '',
                'What matters is anything under `taskbuddy-data` or',
                '`taskbuddy-auth` marked *requires replacement* or *destroy* -',
                'that is the database or the user pool, and the deploy script',
                'refuses those unless ALLOW_STATEFUL_REPLACEMENT is set.',
                '',
                '```',
                clipped,
                '```',
              ].join('\n'),
            })
