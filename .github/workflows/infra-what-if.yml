# Compiles the Bicep and posts the what-if plan on any PR that touches
# infrastructure. It never deploys: the point is that a reviewer sees the
# blast radius before merging, not that CI holds credentials able to change
# production.
#
# Auth is OIDC federation, no stored secret. Repository setup, once:
#
#   az ad app create --display-name taskbuddy-gha
#   az ad app federated-credential create --id <appId> --parameters '{
#     "name": "gha-pr",
#     "issuer": "https://token.actions.githubusercontent.com",
#     "subject": "repo:<owner>/<repo>:pull_request",
#     "audiences": ["api://AzureADTokenExchange"]
#   }'
#   az role assignment create --assignee <appId> --role Reader \
#     --scope /subscriptions/<sub>/resourceGroups/taskbuddy-rg
#
# Reader is deliberate and sufficient: what-if is a read operation.

name: infra what-if

on:
  pull_request:
    paths:
      - 'azure/infra/**'
      - '.github/workflows/infra-what-if.yml'

permissions:
  id-token: write # required to mint the OIDC token
  contents: read
  pull-requests: write # required to post the plan as a comment

jobs:
  what-if:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        # Runs before login: a syntax error should fail without touching Azure.
        run: |
          az bicep install
          az bicep build --file azure/infra/main.bicep --stdout > /dev/null
          az bicep build --file azure/infra/budget.bicep --stdout > /dev/null

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: What-if
        id: whatif
        env:
          SRV: ${{ vars.PG_SERVER_NAME }}
          DB: taskbuddy
          ADMIN: ${{ vars.PG_ADMIN_USER }}
          # Write-only on the server and never read back, so a placeholder is
          # enough for what-if. CI cannot change the real password with it.
          ADMIN_PW: placeholder-not-used-by-what-if
          LOC: eastasia
          DEV_IP: ${{ vars.DEV_IP }}
          FOUNDRY: taskbuddy-foundry
          WORKSPACE: taskbuddy-logs
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
        run: |
          az deployment group what-if \
            --resource-group taskbuddy-rg \
            --template-file azure/infra/main.bicep \
            --parameters azure/infra/main.bicepparam \
            > whatif.txt 2>&1 || true
          cat whatif.txt

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const plan = fs.readFileSync('whatif.txt', 'utf8')
            // 65536 is the GitHub comment ceiling; leave room for the wrapper.
            const clipped = plan.length > 60000
              ? plan.slice(0, 60000) + '\n\n...truncated, see the job log.'
              : plan
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                '### Azure what-if',
                '',
                'Baseline is 17 NoChange / 3 Modify. The 3 are read-only',
                'properties ARM always reports; see `azure/infra/README.md`.',
                'A fourth Modify means real drift.',
                '',
                '```',
                clipped,
                '```',
              ].join('\n'),
            })
